# ── Paths ──────────────────────────────────────────────────────────────
data:
  raw_dir: "data/raw/OTU_2d"
  images_subdir: "images"
  masks_subdir: "annotations"
  metadata_file: "label.csv"          # or null to auto-discover
  splits_csv: "results/splits.csv"
  image_size: 224
  group_col: "patient_id"
  num_workers: 4
  split_ratios: {train: 0.60, val: 0.10, calib: 0.15, test: 0.15}

# ── Experiment ─────────────────────────────────────────────────────────
experiment:
  run_name: "exp_003"
  random_seed: 42
  device: "auto"                        # "auto", "cuda", "cpu"
  use_amp: true                         # Mixed precision training
  use_kfold: false
  kfold_n_splits: 5

# ── Training ───────────────────────────────────────────────────────────
training:
  models_to_train:
    - "densenet121"
    - "resnet50"
    - "efficientnet_b3"
    - "mobilenet_v3_large"
    - "swin_t"
  num_classes: 8
  batch_size: 32
  num_epochs: 60
  warmup_epochs: 5
  freeze_epochs: 5
  dropout: 0.5
  lr_backbone: 0.0001
  lr_head: 0.001
  weight_decay: 0.0001
  loss_fn: "weighted_ce"               # "weighted_ce" or "focal"
  focal_gamma: 2.0
  label_smoothing: 0.1
  early_stopping_patience: 15
  early_stopping_metric: "macro_f1"
  use_mixup: true
  mixup_alpha: 0.4
  cutmix_alpha: 1.0
  use_swa: true
  use_tta: true
  use_ensemble: true

# ── Gradient Safety ────────────────────────────────────────────────────
gradient:
  clip_value: 1.0
  explosion_threshold: 10.0
  skip_threshold: 100.0

# ── XAI ────────────────────────────────────────────────────────────────
xai:
  cam_thresholds: [0.5, 0.6, 0.7, 0.8, 0.9]
  cam_methods: ["gradcam", "gradcam_pp", "scorecam", "eigencam"]
  gradient_methods: ["saliency", "integrated_gradients"]
  run_shap: false
  shap_n_background: 100
  run_faithfulness: true               # Insertion/Deletion AUC
  faithfulness_n_steps: 10
  save_viz: true
  viz_n_samples: 20                    # How many sample images to visualize

# ── Evaluation ─────────────────────────────────────────────────────────
evaluation:
  screening:
    sc_thresholds: [0.1, 0.15, 0.2, 0.25, 0.3]
    cc_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
  statistical:
    significance_level: 0.05

# ── Output ─────────────────────────────────────────────────────────────
output:
  results_dir: "results"
  checkpoints_dir: "results/checkpoints"
  logs_dir: "results/logs"
  figures_dir: "results/figures"
  xai_results_dir: "results/xai"
  viz_dir: "results/visualizations"

# ── uncertainty ─────────────────────────────────────────────────────────
uncertainty:
  alpha: 0.10
  alpha_sweep: [0.05, 0.10, 0.20]
  score: "lac"                    # "lac" or "aps"
  rare_class_policy: "global"     # "global" (disclosed fallback) or "inf" (always include class)
  temperature_fit_split: "val"    # "val" or "calib"
  mc_dropout_samples: 30
  min_calibration_per_class: 10
  ece_n_bins: 15
